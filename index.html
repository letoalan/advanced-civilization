<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stop Chrome/browser auto-translate from rewriting React-managed text
         nodes, which corrupts the DOM and crashes the reconciler with
         insertBefore/removeChild "not a child of this node" errors. -->
    <meta name="google" content="notranslate" />
    <title>Advanced Civilization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #080b0f; color: #f7f4ec; }
      #root { display: flex; flex-direction: column; height: 100vh; }

      /* Archaeological Museum UI Components (Napoli MANN & Acropolis Museum) */
      .civ-bar { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(14px); border-top: 1px solid rgba(212, 175, 55, 0.25); }
      .civ-panel { background: rgba(16, 21, 28, 0.82); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); border-radius: 8px; color: #f7f4ec; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
      .civ-msg { background: rgba(22, 28, 38, 0.88); backdrop-filter: blur(14px); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 8px; color: #fdfaf2; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
      .civ-btn { 
        background: rgba(22, 28, 38, 0.75); 
        backdrop-filter: blur(8px); 
        border: 1px solid rgba(212, 175, 55, 0.3); 
        border-radius: 6px; 
        color: #f7f4ec; 
        font-family: 'Outfit', sans-serif; 
        font-weight: 600; 
        padding: 6px 12px; 
        cursor: pointer; 
        font-size: 11px; 
        letter-spacing: 0.3px; 
        transition: all .16s cubic-bezier(0.2, 0, 0, 1); 
        box-shadow: 0 2px 6px rgba(0,0,0,0.4); 
      }
      .civ-btn:hover:not(:disabled) { 
        background: rgba(35, 45, 60, 0.92); 
        border-color: #d4af37; 
        color: #ffffff; 
        transform: translateY(-1px); 
        box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 10px rgba(212, 175, 55, 0.2); 
      }
      .civ-btn:active:not(:disabled) { transform: translateY(1px); }
      .civ-btn:disabled { opacity: .35; cursor: default; filter: grayscale(50%); }
      .civ-btn.on { 
        background: linear-gradient(135deg, #c59b27 0%, #8c6812 50%, #5c4106 100%); 
        color: #fff; 
        border-color: #d4af37; 
        box-shadow: 0 0 14px rgba(212, 175, 55, 0.35); 
      }
      .civ-nav { 
        background: rgba(18, 24, 34, 0.7); 
        backdrop-filter: blur(8px); 
        border: 1px solid rgba(255, 255, 255, 0.08); 
        border-radius: 6px; 
        color: #c9d2de; 
        font-family: 'Outfit', sans-serif; 
        font-weight: 600; 
        padding: 5px 10px; 
        cursor: pointer; 
        font-size: 11px; 
        letter-spacing: .4px; 
        transition: all .16s ease; 
      }
      .civ-nav:hover { background: rgba(30, 38, 50, 0.9); color: #d4af37; border-color: rgba(212, 175, 55, 0.3); }
      .civ-nav.on { background: rgba(35, 45, 60, 0.95); color: #d4af37; border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
      .civ-tab { flex: 1; text-align: center; padding: 7px 6px; font-weight: 600; font-size: 11px;
                 background: rgba(13, 17, 23, 0.6); color: #959fad; border-right: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all .15s; }
      .civ-tab:hover { background: rgba(22, 28, 38, 0.85); color: #f7f4ec; }
      .civ-tab.act { background: rgba(27, 34, 46, 0.95); color: #d4af37; border-bottom: 2px solid #d4af37; }
      .civ-lbl { font-size: 11px; letter-spacing: .3px; color: #c9d2de; font-weight: 500; line-height: 1.45; }

      /* Sleek dark scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(10, 13, 18, 0.5); }
      ::-webkit-scrollbar-thumb { background: rgba(45, 55, 72, 0.7); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
